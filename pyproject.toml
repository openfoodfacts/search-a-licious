[project]
name = "search-a-licious"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.12,<4.0"
license = "AGPL-3.0-only"
authors = [{ name = "Open Food Facts team" }]
dependencies = [
  "cachetools~=7.2.1",
  "elasticsearch-dsl~=8.9.0",
  "fastapi~=0.143.0",
  "jinja2~=3.1.6",
  "luqum~=1.0.0",
  "opensearch-py~=2.8.0",
  "orjson~=3.13.0",
  "py-healthcheck>=1.10.1,<2.0.0",
  "pydantic-settings~=2.15.0",
  "pyyaml~=6.0.3",
  "redis~=8.1.0",
  "requests~=2.34.2",
  "sentry-sdk[fastapi]~=2.72.0",
  "tqdm~=4.70.1",
  "typer~=0.27.3",
  "uvicorn~=0.54.0",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.venv
)/
'''

[tool.coverage.run]
data_file = ".cov/.coverage"
source = ["app"]

[tool.coverage.xml]
output = ".cov/coverage.xml"

[tool.coverage.html]
directory = ".cov/htmlcov"

[tool.isort]
profile = "black"

[tool.mypy]
ignore_missing_imports = true
exclude = '''(?x)(
    .*\.cache/pre-commit/.*  # avoid pre-commit cache
)'''

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
coverage = { extras = ["toml"], version = "^7.16.2" }
factory-boy = "^3.3.3"
httpx2 = "^2.16.0"
mypy = "^2.4.0"
pre-commit = "^4.7.0"
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
types-cachetools = "^7.0.0.20260713"
types-pyyaml = "^6.0.12.20260906"
types-requests = "^2.33.0.20261006"

[tool.poetry.group.docs.dependencies]
autodoc-pydantic = "^2.2.0"
rich = "^15.0.0"
sphinx = "9.1.0"
