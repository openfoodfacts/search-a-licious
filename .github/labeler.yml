# Add labels to any pull request with changes to the specified paths

📚 Documentation:
- changed-files:
  - any-glob-to-any-file:
    - 'docs/**/*'
    - 'docs/*'
    - 'README.md'
    - 'CHANGELOG.md'
    - 'mkdocs.yml'
    - 'frontend/README.md'

API:
- changed-files:
  - any-glob-to-any-file:
    - 'docs/sphinx/api.rst'
    - 'docs/users/ref-openapi.md'
    - 'app/api.py'
    - 'app/middleware.py'
    - 'app/health.py'
    - 'app/exceptions.py'

OpenAPI:
- changed-files:
  - any-glob-to-any-file:
    - 'docs/users/ref-openapi.md'

Build Scripts:
- changed-files:
  - any-glob-to-any-file:
    - 'scripts/**/*'
    - 'Makefile'

🐳 docker:
- changed-files:
  - any-glob-to-any-file:
    - 'Dockerfile'
    - '.dockerignore'
    - 'docker-compose.yml'
    - 'docker/**/*'
    - 'frontend/Dockerfile'
    - 'frontend/.dockerignore'
    - 'scripts/Dockerfile.*'

github_actions:
- changed-files:
  - any-glob-to-any-file:
    - '.github/workflows/**/*'
    - '.github/labeler.yml'
    - '.github/dependabot.yml'

